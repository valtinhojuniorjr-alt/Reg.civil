<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chamar Próximo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f4f4;
    }

    .container {
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      color: #333;
      font-size: 2rem;
    }

    button {
      width: 350px;
      height: 350px;
      border-radius: 50%;
      border: none;
      background: #1d4ed8;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    button:hover {
      transform: scale(1.03);
    }

    button:active {
      transform: scale(0.97);
      background: #1e40af;
    }

    .status {
      margin-top: 25px;
      font-size: 1.2rem;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Recepção</h1>

    <button onclick="chamarProximo()">
      CHAMAR<br>REG.CIVIL
    </button>

    <div class="status" id="status"></div>
  </div>

  <script>
    async function chamarProximo() {
      const status = document.getElementById('status');

      try {
        await fetch('https://ntfy.sh/cartorioklesiany', {
          method: 'POST',
          body: 'Pode chamar o próximo REGISTRO CIVIL'
        });

        status.innerHTML = 'Notificação enviada com sucesso!';
      } catch (e) {
        status.innerHTML = 'Erro ao enviar notificação.';
      }
    }
  </script>
</body>
</html>
